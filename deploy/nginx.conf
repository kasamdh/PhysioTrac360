# Nginx reverse proxy for the Gunicorn socket, serving static/media directly.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/physiotrac360.conf
#   sudo nginx -t && sudo systemctl restart nginx
#
# Replace server_name with the instance's public IP, or a domain once you have
# one. This is HTTP-only, suitable for a test instance — add a cert (e.g. via
# certbot) before this handles anything but throwaway test data.

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location /static/ {
        alias /home/ubuntu/PhysioTrac360/staticfiles/;
    }

    location /media/ {
        alias /home/ubuntu/PhysioTrac360/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
